<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Markdown Beautifier</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Marked.js for Preview Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-page: #292C33; /* Slightly darker, more blue-tinted slate */
            --bg-card: #292C33; /* Adjust card to match new darker bg */
            --bg-input: #181A20; 
            --border: #303540;  
            --text-primary: #E2E4E9; /* Brighter white for high contrast */
            
            --text-violeta: #BB7CD7;
            --text-rojo: #D17277;
            --text-verde: #A7DF48;
            --text-naranja: #DFC184;
            --text-gris: #5D636F;
            --text-cyan: #70E1E8;
            
            --text-secondary: #94a3b8; /* Slate 400 */
            --accent: #06b6d4; /* Cyan 500 */
            
            /* Alert Colors */
            --note-bg: rgba(59, 130, 246, 0.05); --note-border: #3b82f6; --note-text: #60a5fa;
            --tip-bg: rgba(34, 197, 94, 0.05); --tip-border: #22c55e; --tip-text: #4ade80;
            --warn-bg: rgba(234, 179, 8, 0.05); --warn-border: #eab308; --warn-text: #facc15;
            --imp-bg: rgba(168, 85, 247, 0.05); --imp-border: #a855f7; --imp-text: #c084fc;
            --caution-bg: rgba(239, 68, 68, 0.05); --caution-border: #ef4444; --caution-text: #f87171;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-page);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .logo {
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
        }

        button {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-switcher {
            gap: 0.5rem;
            background: var(--bg-input);
            padding: 0.25rem;
            border-radius: 8px;
            margin-right: 1rem;
        }

        .view-switcher button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-switcher button:hover {
            color: var(--text-primary);
        }

        .view-switcher button.active {
            background: var(--accent);
            color: white;
        }
        button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        button.primary:hover { filter: brightness(1.1); }

        /* View Switcher */
        .view-switcher {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-input);
            padding: 0.25rem;
            border-radius: 8px;
            margin-right: 1rem;
        }

        .view-switcher button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .view-switcher button:hover {
            color: var(--text-primary);
        }

        .view-switcher button.active {
            background: var(--accent);
            color: #000;
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            gap: 1.5rem;
            padding: 0 1.5rem 1.5rem;
        }

        /* View Modes */
        .view-raw .preview-pane { display: none; }
        .view-raw .editor-pane { flex: 1; border-right: none; }
        
        .view-live .editor-pane { display: none; }
        .view-live .preview-pane { flex: 1; }
        
        .view-hybrid .editor-pane { flex: 1; }
        .view-hybrid .preview-pane { flex: 1; }

        /* Split View */
        .editor-pane, .preview-pane {
            flex: 1;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-pane { 
            border-right: 1px solid var(--border); 
            position: relative; 
            background-color: var(--bg-page);
        }

        .editor-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        #editor, #highlighting {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: 'Fira Code', Consolas, 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.6;
            padding: 2rem;
            margin: 0;
            border: none;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            tab-size: 4;
            -moz-tab-size: 4;
        }

        #editor {
            background: transparent;
            color: transparent;
            resize: none;
            outline: none;
            caret-color: var(--accent);
            z-index: 2;
            overflow-x: hidden;
            border-radius: 0;
        }

        #highlighting {
            color: var(--text-primary);
            pointer-events: none;
            z-index: 1;
            background: transparent;
            overflow-x: hidden;
        }

        /* Custom Highlighting Classes */
        .hl-purple { color: #BB7CD7; }
        .hl-green-italic { color: #A7DF49; font-style: italic; }
        .hl-red { color: #CF7276; }
        .hl-yellow { color: #ffc654ff; }
        .hl-white { color: #c2c2c2ff; }
        .hl-white-dark { color: #999; }
        .hl-white-darker { color: #777; }
        .hl-blue { color: #74ADEA; }
        .hl-grey-italic { color: #5E636F; font-style: italic; }

        .tab {
            border-left: 1px solid #666;
            display: inline-block;
            white-space: pre;
        }

        .hl-hide {
            opacity: 0;
            font-size: 0;
            display: inline-block;
        }
        
        /* Toolbar */
        .toolbar {
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.1em; /* Increased spacing */
            font-weight: 600;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* PREVIEW STYLING */
        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem;
            background: var(--bg-page);
        }

        .preview-content h1, .preview-content h2, .preview-content h3, .preview-content h4, .preview-content h5, .preview-content h6 {
            color: var(--text-primary);
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        .preview-content h1 { font-size: 2.2rem; color: var(--text-rojo); border-bottom: 2px solid var(--border); padding-bottom: 0.6rem; margin-top: 0; }
        .preview-content h2 { font-size: 1.8rem; color: var(--text-naranja); border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
        .preview-content h3 { font-size: 1.5rem; color: var(--text-violeta); }
        .preview-content h4 { font-size: 1.3rem; color: var(--text-verde); }
        .preview-content h5 { font-size: 1.1rem; color: var(--text-cyan); }

        .preview-content p { margin-bottom: 1.5rem; line-height: 1.75; font-size: 1.05rem; color: #B0B5C0; }
        
        .preview-content strong { color: var(--text-primary); font-weight: 600; }
        .preview-content a:hover { border-bottom-color: var(--accent); background: rgba(6, 182, 212, 0.05); }

        /* Code in Preview */
        .preview-content .code-block-wrapper {
            position: relative;
            margin: 1.5em 0;
            background: #1a1b26; /* Tokyo Night Darker background */
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .preview-content .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .preview-content .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.25rem 0.5rem;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .preview-content .copy-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .preview-content pre {
            background: transparent !important;
            border: none !important;
            padding: 1.25rem !important;
            margin: 0 !important;
            overflow-x: auto;
        }
        
        .preview-content code {
            font-family: 'Fira Code', Consolas, 'Courier New', monospace;
            background: rgba(255,255,255,0.05);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--text-primary);
        }
        
        .preview-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        /* Blockquotes / Alerts */
        .preview-content blockquote {
            border-left: 3px solid var(--border);
            margin: 2rem 0;
            padding: 0.5rem 0 0.5rem 1.5rem;
            color: #9BA1B0;
            font-style: italic;
            line-height: 1.6;
        }

        .preview-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 3rem 0;
        }

        /* GitHub Alerts Styling */
        .markdown-alert {
            margin-bottom: 24px;
            padding: 1.25rem;
            border-left-width: .25rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            position: relative;
            background: var(--bg-card);
        }
        
        .markdown-alert-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: capitalize;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        .markdown-alert-header i {
            width: 18px;
            height: 18px;
        }
        
        .markdown-alert-note { border-left-color: var(--note-border); color: var(--text-primary); }
        .markdown-alert-note .markdown-alert-header { color: var(--note-text); }
        
        .markdown-alert-tip { border-left-color: var(--tip-border); color: var(--text-primary); }
        .markdown-alert-tip .markdown-alert-header { color: var(--tip-text); }
        
        .markdown-alert-warning { border-left-color: var(--warn-border); color: var(--text-primary); }
        .markdown-alert-warning .markdown-alert-header { color: var(--warn-text); }
        
        .markdown-alert-important { border-left-color: var(--imp-border); color: var(--text-primary); }
        .markdown-alert-important .markdown-alert-header { color: var(--imp-text); }

        .markdown-alert-caution { border-left-color: var(--caution-border); color: var(--text-primary); }
        .markdown-alert-caution .markdown-alert-header { color: var(--caution-text); }

        .markdown-alert p:last-child { margin-bottom: 0; }

        /* Tables & Lists */
        .preview-content table { width: 100%; border-collapse: collapse; margin: 1.5em 0; font-size: 0.9em; }
        .preview-content th, .preview-content td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
        .preview-content th { color: var(--text-primary); font-weight: 600; }
        .preview-content ul, .preview-content ol { padding-left: 1.5rem; margin-bottom: 1.5em; }
        .preview-content li { margin-bottom: 0.5em; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-page); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
        
        .cm-variable-3 {
        }
        .cm-comment {
            color: var(--text-verde);
        }
        .cm-comment {
            color: var(--text-verde);
            font-style: italic;
        }
        .cm-header {
            color: var(--text-rojo);
        }
        .cm-em {
            color: var(--text-violeta);
        }
        .cm-quote {
            color: var(--text-gris);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i data-lucide="sparkles"></i>
            MARKDOWN BEAUTIFIER
        </div>
        <div class="actions">
            <div class="view-switcher">
                <button onclick="setViewMode('raw')" id="btn-raw">RAW</button>
                <button onclick="setViewMode('live')" id="btn-live">LIVE</button>
                <button onclick="setViewMode('hybrid')" id="btn-hybrid">HYBRID</button>
            </div>
            <button onclick="copyHTML()"><i data-lucide="code"></i> Copy HTML</button>
            <button class="primary" onclick="window.print()"><i data-lucide="printer"></i> Print / PDF</button>
        </div>
    </header>

    <main>
        <div class="editor-pane">
            <div class="toolbar">Editor (Custom Syntax)</div>
            <div class="editor-wrapper">
                <div id="highlighting" aria-hidden="true"></div>
                <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
            </div>
        </div>
        <div class="preview-pane">
            <div class="toolbar">Live Preview</div>
            <div id="preview" class="preview-content"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const preview = document.getElementById('preview');

        // Default Content
        const DEFAULT_TEXT = [
            '# Markdown Beautifier 🎨',
            '',
            'This is a **premium** markdown editor and previewer, designed to mirror the "Antigravity" aesthetic.',
            '',
            '## 🚀 Core Features',
            '- **High-Fidelity Typography**: Inter for reading, Fira Code for logic.',
            '- **Gfm Alerts**: Visual callouts for notes, tips, and warnings.',
            '- **Syntax Highlighting**: Beautiful code blocks with copy support.',
            '- **Interactive UI**: Real-time rendering and state persistence.',
            '',
            '### 💡 GitHub Alerts',
            '',
            '> [!NOTE]',
            '> These alerts use Lucide icons and look exactly like Antigravity.',
            '',
            '> [!TIP]',
            '> Pro Tip: Press `Cmd/Ctrl + P` to save as PDF!',
            '',
            '> [!CAUTION]',
            '> This tool is highly addictive for document lovers.',
            '',
            '### 📊 Data Visualization',
            '',
            '| Feature | Status | Priority |',
            '| :--- | :---: | :---: |',
            '| Dark Mode | ✅ | High |',
            '| Code Highlighting | ✅ | High |',
            '| Interactive Icons | ✅ | Med |',
            '| Export to PDF | ✅ | Med |',
            '',
            '### 💻 Code Example',
            '',
            '```javascript',
            '// Copy and paste this to see the highlighting in action!',
            'const beautifier = {',
            '    engine: "Antigravity",',
            '    speed: "Infinite",',
            '    render: (content) => {',
            '        return "✨ " + content + " ✨";',
            '    }',
            '};',
            '```'
        ].join('\\n');

        const textarea = document.getElementById("editor");
        const highlighting = document.getElementById("highlighting");

        // Load Content
        const saved = localStorage.getItem('md-content');
        textarea.value = saved || DEFAULT_TEXT;

        // Custom Highlighting Logic
        function applyHighlighting(text) {
            // Escape HTML to prevent XSS and rendering issues
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Define Rules
            const rules = [
                // 1. Everything between <!-- CONTENT --> -> italic + #A7DF49 (multiline)
                { regex: /&lt;!--(?:.|\n)*?--&gt;/g, class: "hl-green-italic" },
                // 2. Everything between * CONTENT * -> #BB7CD7 (multiline)
                { regex: /\*(?:.|\n)*?\*/g, class: "hl-purple" },
                // 3. Tiered Hyphens (whole line coloring)
                // Level 3: --- (exactly 3)
                { 
                    regex: /^(.*?[\s\(\[\{]|)(---(?!-).*$)/gm, 
                    class: "hl-white-darker", 
                    capture: 2,
                    transform: (c) => `-<span class="hl-hide">--</span>${c.substring(3)}`
                },
                // 4. Everything including ++ -> #DFC184 (yellow)
                { regex: /^.*?\+\+.*$/gm, class: "hl-yellow" },
                // 5. Everything between < > -> #DFC184 (yellow)
                { regex: /&lt;.*?&gt;/g, class: "hl-yellow" },
                // 6. Level 2 Hyphens: -- (exactly 2)
                { 
                    regex: /^(.*?[\s\(\[\{]|)(--(?!-).*$)/gm, 
                    class: "hl-white-dark", 
                    capture: 2,
                    transform: (c) => `-<span class="hl-hide">-</span>${c.substring(2)}`
                },
                // 7. Level 1 Hyphens: - (exactly 1)
                { regex: /^(.*?[\s\(\[\{]|)(-(?!(?:--|&gt;)).*$)/gm, class: "hl-white", capture: 2 },
                // 8. Everything between [ CONTENT ] -> #74ADEA
                { regex: /\[.*?\]/g, class: "hl-blue" },
                // 9. Everything after # in the same line -> #CF7276
                { regex: /#.*$/gm, class: "hl-red" },
                // 10. Everything after == -> #CF7276 (same-line)
                { regex: /==.*$/gm, class: "hl-red" },
                // 11. Every line that starts with a > -> italic + #5E636F
                { regex: /^&gt;.*$/gm, class: "hl-grey-italic" },
                // 12. Visual Tabs (Double Spaces) - Must be last to catch prefixes
                { regex: /  /g, class: "tab" }
            ];

            // To prevent rules from interfering with already applied spans,
            // we use a placeholder approach for each rule.
            let placeholders = [];
            let i = 0;

            rules.forEach(rule => {
                html = html.replace(rule.regex, (match, p1, p2) => {
                    let content = rule.capture === 2 ? p2 : match;
                    const prefix = rule.capture === 2 ? p1 : "";
                    
                    if (rule.transform) {
                        content = rule.transform(content);
                    }
                    
                    const placeholder = `__HL_${i}__`;
                    placeholders.push({
                        id: placeholder,
                        content: `<span class="${rule.class}">${content}</span>`
                    });
                    i++;
                    return prefix + placeholder;
                });
            });

            // Put back the highlighted content
            placeholders.reverse().forEach(p => {
                html = html.replace(p.id, p.content);
            });

            // Add a trailing newline to handle scrolling correctly
            return html + (text.endsWith('\n') ? ' ' : '');
        }

        // Configure Marked
        marked.use({ 
            gfm: true, 
            breaks: true,
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        // Custom renderer for GitHub Alerts
        const alertConfig = {
            note: { icon: 'info', color: 'var(--note-text)' },
            tip: { icon: 'lightbulb', color: 'var(--tip-text)' },
            important: { icon: 'message-circle-more', color: 'var(--imp-text)' },
            warning: { icon: 'triangle-alert', color: 'var(--warn-text)' },
            caution: { icon: 'octagon-alert', color: 'var(--caution-text)' }
        };

        const alertExtension = {
            name: 'alert',
            level: 'block',
            start(src) { return src.match(/>\s\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/)?.index; },
            tokenizer(src, tokens) {
                const rule = /^>\s\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*\n((?:>\s?.*\n?)*)/;
                const match = rule.exec(src);
                if (match) {
                    const type = match[1].toLowerCase();
                    const text = match[2].replace(/^>\s?/gm, '');
                    return {
                        type: 'alert',
                        raw: match[0],
                        alertType: type,
                        text: text.trim(),
                        tokens: []
                    };
                }
            },
            renderer(token) {
                const config = alertConfig[token.alertType];
                return `<div class="markdown-alert markdown-alert-${token.alertType}">
                    <div class="markdown-alert-header">
                        <i data-lucide="${config.icon}"></i>
                        ${token.alertType}
                    </div>
                    <div class="markdown-alert-content">${marked.parse(token.text)}</div>
                </div>`;
            }
        };

        // Custom renderer for Code Blocks to add Copy Button and Language Header
        const renderer = new marked.Renderer();
        const originalCode = renderer.code.bind(renderer);
        renderer.code = function(code, infostring, escaped) {
            const lang = (infostring || '').match(/\S*/)[0];
            const highlighted = hljs.highlightAuto(code).value;
            
            return `
                <div class="code-block-wrapper">
                    <div class="code-block-header">
                        <span>${lang || 'text'}</span>
                        <button class="copy-btn" onclick="copyCode(this)">
                            <i data-lucide="copy" style="width:12px;height:12px;"></i>
                            Copy
                        </button>
                    </div>
                    <pre><code class="hljs ${lang}">${highlighted}</code></pre>
                </div>
            `;
        };

        marked.use({ extensions: [alertExtension], renderer });

        // Update Logic
        async function updatePreview() {
            const val = textarea.value;
            localStorage.setItem('md-content', val);
            
            // Sync Highlighting
            highlighting.innerHTML = applyHighlighting(val);
            
            // Sync Preview
            preview.innerHTML = marked.parse(val);
            // Re-initialize icons in the preview
            lucide.createIcons();
        }

        // Sync Scrolling
        textarea.addEventListener('scroll', () => {
            highlighting.scrollTop = textarea.scrollTop;
            highlighting.scrollLeft = textarea.scrollLeft;
        });

        // Listen to changes
        textarea.addEventListener('input', updatePreview);

        // Handle Tab key in textarea
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;

                // set textarea value to: text before caret + tab + text after caret
                this.value = this.value.substring(0, start) +
                    "    " + this.value.substring(end);

                // put caret at right position again
                this.selectionStart = this.selectionEnd = start + 4;
                updatePreview();
            }
        });

        function copyCode(btn) {
            const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i data-lucide="check" style="width:12px;height:12px;"></i> Copied!';
                lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    lucide.createIcons();
                }, 2000);
            });
        }
        
        // View Modes Logic
        function setViewMode(mode) {
            const main = document.querySelector('main');
            main.classList.remove('view-raw', 'view-live', 'view-hybrid');
            main.classList.add(`view-${mode}`);
            
            // Update button states
            document.querySelectorAll('.view-switcher button').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            // Save preference
            localStorage.setItem('viewMode', mode);
            
            // Update preview if switching to interactive
            if (mode !== 'raw') {
                updatePreview();
            }
        }

        // Initialize view mode
        const savedMode = localStorage.getItem('viewMode') || 'raw';
        setViewMode(savedMode);

        // Initial render
        updatePreview();

        function copyHTML() {
            const html = preview.innerHTML;
            navigator.clipboard.writeText(html).then(() => alert('HTML copied to clipboard!'));
        }
    </script>
</body>
</html>
